name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Generate fictional fixtures
        run: python scripts/generate_synthetic_data.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests and production build
        run: python scripts/run_checks.py
      - name: Evaluate baselines
        run: |
          python scripts/train_categorizer.py
          python scripts/evaluate_anomaly.py
          python scripts/evaluate_forecaster.py
          python scripts/evaluate_rag.py
